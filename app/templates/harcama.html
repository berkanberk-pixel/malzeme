{% extends "base.html" %}
{% block title %}Proje Harcaması{% endblock %}
{% block content %}
<h2 class="mb-4">Proje Harcaması</h2>
<div class="card p-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">İl</label>
        <select class="form-select" onchange="location.href='?il='+this.value+'&mq={{ mq }}&pq={{ pq }}'">
          <option value="">İl seçin</option>
          {% for il in iller %}
          <option value="{{ il.Uretim_Yeri }}" {% if request.args.get('il') == il.Uretim_Yeri %}selected{% endif %}>
            {{ il.Uretim_Yeri_Tanimi }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label">Kaynak Depo *</label>
        <select name="kaynak_depo" class="form-select" required
                onchange="location.href='?il={{ request.args.get('il','') }}&kaynak='+this.value+'&mq={{ mq }}&pq={{ pq }}'">
          <option value="">Depo seçin</option>
          {% for d in depolar %}
          <option value="{{ d.ID }}" {% if request.args.get('kaynak') == d.ID %}selected{% endif %}>
            {{ d.ID }} - {{ d.Depo_Yeri_Tanimi }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Proje *</label>
        <input type="text" class="form-control mb-2" placeholder="Proje ara..."
               value="{{ pq }}" onchange="location.href='?il={{ request.args.get('il','') }}&kaynak={{ request.args.get('kaynak','') }}&mq={{ mq }}&pq='+this.value">
        <select name="proje_kod" class="form-select" required size="5">
          {% for p in projeler %}
          <option value="{{ p.IS_Kod }}">{{ p.IS_Kod }} - {{ p.IS_listesi }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Malzeme *</label>
        <input type="text" class="form-control mb-2" placeholder="Malzeme ara..." value="{{ mq }}"
               onchange="location.href='?il={{ request.args.get('il','') }}&kaynak={{ request.args.get('kaynak','') }}&pq={{ pq }}&mq='+this.value">
        <select name="malzeme_kodu" class="form-select" required size="5"
                onchange="location.href='?il={{ request.args.get('il','') }}&kaynak={{ request.args.get('kaynak','') }}&malzeme='+this.value+'&pq={{ pq }}&mq={{ mq }}'">
          {% for m in malzemeler %}
          <option value="{{ m.Malzeme_Kodu }}" {% if request.args.get('malzeme') == m.Malzeme_Kodu %}selected{% endif %}>
            {{ m.Malzeme_Kodu }} - {{ m.Malzmeme_Tanimi }}
          </option>
          {% endfor %}
        </select>
        {% if mevcut_bakiye is not none %}
        <div class="alert alert-info mt-2 py-1">Mevcut bakiye: <strong>{{ mevcut_bakiye }}</strong></div>
        {% endif %}
      </div>
      <div class="col-md-2">
        <label class="form-label">Miktar *</label>
        <input type="number" name="miktar" class="form-control" step="0.01" min="0.01" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Birim</label>
        <select name="birim" class="form-select">
          {% for b in birimler %}
          <option value="{{ b.Birim }}">{{ b.Birim }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Belge No</label>
        <input type="text" name="belge_no" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">Açıklama</label>
        <input type="text" name="aciklama" class="form-control">
      </div>
    </div>
    <button type="submit" class="btn btn-danger mt-3">Harcama Kaydet</button>
  </form>
</div>
{% endblock %}
